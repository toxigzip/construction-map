<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта объектов строительства</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- SheetJS -->
    <script lang="javascript" src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- SVG Pattern Definition for Hatching -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <pattern id="hatch-pattern" patternUnits="userSpaceOnUse" width="10" height="10"
                patternTransform="rotate(45)">
                <line x1="0" y1="0" x2="0" y2="10" stroke="#3498db" stroke-width="2" stroke-opacity="0.5" />
            </pattern>
        </defs>
    </svg>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Объекты</h1>
                <div class="filters">
                    <select id="status-filter">
                        <option value="all">Все статусы</option>
                        <option value="active">Активные</option>
                        <option value="planned">Планируемые</option>
                    </select>
                </div>
                <div class="radius-controls">
                    <details open>
                        <summary>Зоны покрытия</summary>
                        <div class="radius-options">
                            <label><input type="checkbox" value="5000"> 5 км</label>
                            <label><input type="checkbox" value="10000"> 10 км</label>
                            <label><input type="checkbox" value="15000"> 15 км</label>
                            <label><input type="checkbox" value="20000"> 20 км</label>
                            <label><input type="checkbox" value="50000"> 50 км</label>
                            <label><input type="checkbox" value="100000"> 100 км</label>
                        </div>
                    </details>
                </div>
                <div class="data-controls">
                    <h3>Управление данными</h3>
                    <div class="data-buttons">
                        <button id="import-btn" class="btn">📂 Импорт Excel</button>
                        <input type="file" id="excel-input" accept=".xlsx, .xls" style="display: none;">
                        <button id="export-btn" class="btn secondary">💾 Скачать Data.js</button>
                        <button id="reset-btn" class="btn danger" title="Сбросить к исходным">↻</button>
                    </div>
                    <div id="import-status" style="font-size: 0.8rem; margin-top: 5px; color: #666;"></div>
                </div>
            </div>
            <div id="object-list" class="object-list">
                <!-- Objects will be populated here by JS -->
            </div>
        </aside>

        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Project Data & Scripts -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
