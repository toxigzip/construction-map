<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта объектов строительства</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- SheetJS -->
    <script lang="javascript" src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-top">
                    <h1 id="results-count">0 объектов</h1>
                    <div class="filter-controls">
                        <select id="status-filter" class="filter-btn">
                            <option value="all">Все статусы</option>
                            <option value="active">Активные</option>
                            <option value="planned">Планируемые</option>
                        </select>
                    </div>
                </div>

                <details class="collapsible-section">
                    <summary>Зоны покрытия</summary>
                    <div class="radius-options">
                        <label><input type="checkbox" value="5000"> 5 км</label>
                        <label><input type="checkbox" value="10000"> 10 км</label>
                        <label><input type="checkbox" value="15000"> 15 км</label>
                        <label><input type="checkbox" value="20000"> 20 км</label>
                        <label><input type="checkbox" value="50000"> 50 км</label>
                        <label><input type="checkbox" value="100000"> 100 км</label>
                    </div>
                </details>

                <details class="collapsible-section">
                    <summary>Управление данными</summary>
                    <div class="data-buttons">
                        <button id="import-btn" class="btn primary">📂 Импорт</button>
                        <input type="file" id="excel-input" accept=".xlsx, .xls" style="display: none;">
                        <button id="export-btn" class="btn">💾 Экспорт</button>
                        <button id="reset-btn" class="btn danger" title="Сбросить данные">↻</button>
                    </div>
                    <div id="import-status" style="font-size: 0.75rem; margin-top: 8px; color: #718096;"></div>
                </details>
            </div>

            <div id="object-list" class="object-list">
                <!-- Objects will be populated here by JS -->
            </div>

            <div class="sidebar-footer">
                <span>© 2026 Карта объектов</span>
            </div>
        </aside>

        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Project Data & Scripts -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
